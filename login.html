<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Kiks</title>

  <link rel="icon" type="image/x-icon" href="./Assets/img/favicon.ico" />

  <link rel="stylesheet" href="./Assets/css/style.css" />
  <link rel="stylesheet" href="./Assets/css/auth.css" />
  <link rel="stylesheet" href="./Assets/css/phone.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans&display=swap" rel="stylesheet" />

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <script src="https://kit.fontawesome.com/2c36e9b7b1.js" crossorigin="anonymous"></script>
</head>

<body class="auth-page page-login">
  <div class="auth-container">
    <div class="auth-box">
      <div class="theme-row">
        <div class="logo">
          <a href="index.html"><img src="./Assets/img/logo.png" alt="logo" /></a>
        </div>
        <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
          <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
            <span id="themeIcon" class="material-symbols-outlined">light_mode</span>
          </button>
        </div>
      </div>

      <h2>Login to Your Account</h2>

      <form id="login-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" />
        </div>

        <button type="submit" class="hero-btn">Login</button>
      </form>

      <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
    </div>
  </div>

  <script type="module" src="Assets/js/login.js"></script>

</body>
</html>
