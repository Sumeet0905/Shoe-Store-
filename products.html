<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products - Kiks</title>
    <link rel="icon" type="image/x-icon" href="./Assets/img/favicon.ico">
    <link rel="stylesheet" href="./Assets/css/style.css">
    <link rel="stylesheet" href="./Assets/css/phone.css">
    <link rel="stylesheet" href="./Assets/css/products.css">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://kit.fontawesome.com/2c36e9b7b1.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="page-products">
    <!-- navbar (keeps same look & icons as index) -->
    <nav class="product-nav">
        <div class="logo"><a href="index.html"><img src="./Assets/img/logo.png" alt="logo"></a></div>
        <ul class="nav-links">
            <a class="list" href="index.html"><li>Home</li></a>
            <a class="list" href="#"><li>Footwear</li></a>
            <a class="list" href="#"><li>About us</li></a>
            <a class="list" href="products.html"><li>Products</li></a>
            <a class="list" href="#"><li>Sale</li></a>
        </ul>
        <ul class="nav-icons">
            <a class="list" href="login.html" title="Account"><li><span class="material-symbols-outlined">person</span></li></a>
            <a class="list" href="wishlist.html" title="Wishlist"><li><span class="material-symbols-outlined">favorite</span><span id="wishCount" class="badge bg-danger"></span></li></a>
            <a class="list" href="cart.html" title="Cart"><li><span class="material-symbols-outlined">shopping_bag</span><span id="cartCountNav" class="badge bg-danger"></span></li></a>
        </ul>
    </nav>

    <main class="products-main container">
        <header class="products-header d-flex align-items-center justify-content-between">
            <div>
                <h1 class="fw-bolder">All Products</h1>
                <p class="muted">Showing all available sneakers</p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <label for="sortSelect" class="muted">Sort</label>
                <select id="sortSelect" class="form-select form-select-sm">
                    <option value="popular">Popularity</option>
                    <option value="latest">Latest</option>
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                </select>
            </div>
        </header>

        <section id="productsGrid" class="products-grid mt-4"></section>

        <!-- bootstrap toasts for add actions -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="actionToast" class="toast align-items-center text-white bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div id="actionToastBody" class="toast-body"></div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>
    </main>

    <footer class="container mt-5 mb-5 footer-small">
        <hr>
        <div class="d-flex justify-content-between align-items-center">
            <div>© 2022 Kiks Square Store</div>
            <div>Back to <a href="index.html">Home</a></div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./Assets/js/products.js"></script>
</body>
</html>
